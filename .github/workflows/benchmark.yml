name: Benchmark Pipeline
on:
  pull_request:
    paths:
      - 'bench/**'
      - 'scripts/bench/**'
      - 'tests/bench/**'
      - '.dockerignore'
      - 'scripts/aot/transpile.sh'
      - 'scripts/aot/prepare-assets.sh'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Hosted-runner profile (smoke, quick, diagnostic, crud, crud-create-delete); run full on a dedicated host'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - smoke
          - diagnostic
          - crud
          - crud-create-delete
      targets:
        description: 'Comma-separated target list (blank for all profile targets)'
        required: false
        default: ''
        type: string
      seed:
        description: 'Random seed for trial scheduling'
        required: false
        default: '20260924'
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark execution and verification
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Unit and CLI contract tests
        run: |
          python3 -m unittest discover -s tests/bench -v
          python3 scripts/bench/run.py run --profile bench/profiles/smoke.yml --dry-run > benchmark-plan-smoke.json
          python3 scripts/bench/run.py run --profile bench/profiles/quick.yml --dry-run > benchmark-plan-quick.json
          python3 scripts/bench/run.py run --profile bench/profiles/diagnostic.yml --dry-run > benchmark-plan-diagnostic.json
          python3 scripts/bench/run.py run --profile bench/profiles/full.yml --dry-run > benchmark-plan-full.json
          python3 scripts/bench/run.py run --profile bench/profiles/crud.yml --dry-run > benchmark-plan-crud.json
          python3 scripts/bench/run.py run --profile bench/profiles/crud-create-delete.yml --dry-run > benchmark-plan-crud-create-delete.json

      - name: Configure benchmark parameters
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROFILE_NAME="${{ inputs.profile }}"
            PROFILE_PATH="bench/profiles/${{ inputs.profile }}.yml"
            TARGETS_VAL="${{ inputs.targets }}"
            SEED_VAL="${{ inputs.seed }}"
          else
            PROFILE_NAME="smoke"
            PROFILE_PATH="bench/profiles/smoke.yml"
            TARGETS_VAL=""
            SEED_VAL="20260924"
          fi
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile_path=$PROFILE_PATH" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS_VAL" >> "$GITHUB_OUTPUT"
          echo "seed=$SEED_VAL" >> "$GITHUB_OUTPUT"

      - name: Build all runtime images
        run: |
          python3 scripts/bench/run.py build \
            --targets rails-cruby-off,rails-cruby-yjit,emit-cruby-off,emit-cruby-yjit,rails-jruby,emit-jruby,spinel,rails-jruby-off,emit-jruby-off \
            --output bench-results/build

      - name: Compare serving runtime, responses and database operations
        run: |
          python3 scripts/bench/run.py preflight \
            --targets rails-cruby-off,rails-cruby-yjit,emit-cruby-off,emit-cruby-yjit,rails-jruby,emit-jruby,spinel,rails-jruby-off,emit-jruby-off \
            --output bench-results/preflight

      - name: Execute sequential benchmark trials (same measurement job)
        run: |
          ARGS="--profile ${{ steps.config.outputs.profile_path }}"
          if [ -n "${{ steps.config.outputs.targets }}" ]; then
            ARGS="$ARGS --targets ${{ steps.config.outputs.targets }}"
          fi
          if [ -n "${{ steps.config.outputs.seed }}" ]; then
            ARGS="$ARGS --seed ${{ steps.config.outputs.seed }}"
          fi
          python3 scripts/bench/run.py run $ARGS \
            --preflight-file bench-results/preflight/preflight.json \
            --output bench-results/measurement

      - name: Verify valid read/update CRUD workload on PR
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/bench/run.py run \
            --profile bench/profiles/crud.yml \
            --preflight-file bench-results/preflight/preflight.json \
            --output bench-results/crud

      - name: Verify valid create/delete workload on PR
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/bench/run.py run \
            --profile bench/profiles/crud-create-delete.yml \
            --preflight-file bench-results/preflight/preflight.json \
            --output bench-results/crud-create-delete

      - name: Publish Step Summary report
        if: always()
        run: |
          if [ -f bench-results/measurement/summary.md ]; then
            cat bench-results/measurement/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f bench-results/measurement/diagnostics.md ]; then
            cat bench-results/measurement/diagnostics.md >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          for scenario in ('crud', 'crud-create-delete'):
              path = Path('bench-results') / scenario / 'report.json'
              if path.exists():
                  data = json.loads(path.read_text())
                  print(f'\n### {scenario}: functional smoke only')
                  print(f"Trial statuses: {data.get('trial_status_counts', {})}")
                  print(f"Database and HTTP verified: {data.get('verified_smoke_trials', 0)}")
                  if data.get('invalid_trials'):
                      print(f"Failed or incomplete: {data['invalid_trials']}")
          PY

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ steps.config.outputs.profile_name }}-${{ github.sha }}
          path: |
            bench-results/
            benchmark-plan-*.json
          retention-days: 14
