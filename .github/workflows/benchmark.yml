name: Benchmark Pipeline
on:
  push:
    branches: [main]
    paths:
      - "bench/**"
      - "scripts/bench/**"
      - "tests/bench/**"
      - "blog/**"
      - "infra/terraform/**"
      - ".agents/skills/**"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - 'blog/**'
      - 'config/aot-toolchain.env'
      - 'bench/**'
      - 'scripts/bench/**'
      - 'tests/bench/**'
      - 'infra/terraform/**'
      - '.agents/skills/**'
      - '.dockerignore'
      - 'scripts/aot/transpile.sh'
      - 'scripts/aot/prepare-assets.sh'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick: unit, profile and Terraform checks; full: image builds, nine-target correctness and hosted smoke'
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full
      profile:
        description: 'For manual full mode only; GCE capacity runs separately on two VMs'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - smoke
          - diagnostic
          - crud
          - crud-create-delete
          - ci-jruby-convergence
      targets:
        description: 'Comma-separated target list (blank for all profile targets)'
        required: false
        default: ''
        type: string
      seed:
        description: 'Random seed for trial scheduling'
        required: false
        default: '20260924'
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark execution and verification
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BENCH_CI: '1'
      BENCH_CI_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'quick' }}
    steps:
      - uses: actions/checkout@v4

      - name: Unit and CLI contract tests
        run: |
          mkdir -p bench-results
          if python3 -m unittest discover -s tests/bench -v > bench-results/unit.log 2>&1; then
            echo '{"status":"passed"}' > bench-results/unit-status.json
          else
            echo '{"status":"failed"}' > bench-results/unit-status.json
            cat bench-results/unit.log
            exit 1
          fi
          cat bench-results/unit.log
          python3 scripts/bench/run.py run --profile bench/profiles/gce-c3-capacity.yml --remote-loadgen bench-loadgen-c3 --gce-project PROJECT_ID --gce-zone asia-northeast1-b --target-host APP_PRIVATE_IP --app-cpus 0,1,2,3 --dry-run > benchmark-plan-gce-c3.json
          python3 scripts/bench/run.py preflight --profile bench/profiles/ci-pagination.yml --dry-run > benchmark-plan-ci-pagination.json
          python3 scripts/bench/run.py run --profile bench/profiles/smoke.yml --dry-run > benchmark-plan-smoke.json
          python3 scripts/bench/run.py run --profile bench/profiles/quick.yml --dry-run > benchmark-plan-quick.json
          python3 scripts/bench/run.py run --profile bench/profiles/ci-jruby-convergence.yml --dry-run > benchmark-plan-ci-jruby-convergence.json
          python3 scripts/bench/run.py run --profile bench/profiles/diagnostic.yml --dry-run > benchmark-plan-diagnostic.json
          python3 scripts/bench/run.py run --profile bench/profiles/full.yml --dry-run > benchmark-plan-full.json
          python3 scripts/bench/run.py run --profile bench/profiles/crud.yml --dry-run > benchmark-plan-crud.json
          python3 scripts/bench/run.py run --profile bench/profiles/crud-create-delete.yml --dry-run > benchmark-plan-crud-create-delete.json

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Validate two-VM Terraform
        run: |
          if (cd infra/terraform && terraform fmt -diff -check && terraform init -backend=false && terraform validate); then
            echo '{"status":"passed"}' > bench-results/terraform-status.json
          else
            echo '{"status":"failed"}' > bench-results/terraform-status.json
            exit 1
          fi

      - name: Configure benchmark parameters
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROFILE_NAME="${{ inputs.profile }}"
            PROFILE_PATH="bench/profiles/${{ inputs.profile }}.yml"
            TARGETS_VAL="${{ inputs.targets }}"
            SEED_VAL="${{ inputs.seed }}"
          else
            PROFILE_NAME="smoke"
            PROFILE_PATH="bench/profiles/smoke.yml"
            TARGETS_VAL=""
            SEED_VAL="20260924"
          fi
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile_path=$PROFILE_PATH" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS_VAL" >> "$GITHUB_OUTPUT"
          echo "seed=$SEED_VAL" >> "$GITHUB_OUTPUT"

      - name: Build all runtime images
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: |
          python3 scripts/bench/run.py build \
            --targets rails-cruby-off,rails-cruby-yjit,emit-cruby-off,emit-cruby-yjit,rails-jruby,emit-jruby,spinel,rails-jruby-off,emit-jruby-off \
            --output bench-results/build

      - name: Compare serving runtime, responses and database operations
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: |
          python3 scripts/bench/run.py preflight \
            --targets rails-cruby-off,rails-cruby-yjit,emit-cruby-off,emit-cruby-yjit,rails-jruby,emit-jruby,spinel,rails-jruby-off,emit-jruby-off \
            --output bench-results/preflight

      - name: Verify 1000-article 20-result pagination on all nine targets
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: |
          python3 scripts/bench/run.py preflight \
            --profile bench/profiles/ci-pagination.yml \
            --output bench-results/pagination-preflight

      - name: Execute sequential benchmark trials (same measurement job)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: |
          ARGS="--profile ${{ steps.config.outputs.profile_path }}"
          if [ -n "${{ steps.config.outputs.targets }}" ]; then
            ARGS="$ARGS --targets ${{ steps.config.outputs.targets }}"
          fi
          if [ -n "${{ steps.config.outputs.seed }}" ]; then
            ARGS="$ARGS --seed ${{ steps.config.outputs.seed }}"
          fi
          python3 scripts/bench/run.py run $ARGS \
            --preflight-file bench-results/preflight/preflight.json \
            --output bench-results/measurement

      - name: Verify valid read/update CRUD workload
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: |
          python3 scripts/bench/run.py run \
            --profile bench/profiles/crud.yml \
            --preflight-file bench-results/preflight/preflight.json \
            --output bench-results/crud

      - name: Verify valid create/delete workload
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: |
          python3 scripts/bench/run.py run \
            --profile bench/profiles/crud-create-delete.yml \
            --preflight-file bench-results/preflight/preflight.json \
            --output bench-results/crud-create-delete

      - name: Publish CI verification report
        if: always()
        run: |
          python3 scripts/bench/ci_report.py
          cat bench-results/ci-verification-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ steps.config.outputs.profile_name }}-${{ github.sha }}
          path: |
            bench-results/
            benchmark-plan-*.json
          retention-days: 14
