name: Rails to Spinel foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CC: clang
      BUILD_JOBS: '2'
      BUNDLE_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.5'
          bundler: '2.6.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang make libsqlite3-dev libjemalloc-dev libssl-dev zlib1g-dev sqlite3 pkg-config
      - name: Generate source for the initial bootstrap
        if: ${{ hashFiles('blog/Gemfile') == '' }}
        run: bash scripts/generate.sh
      - name: Rails baseline tests
        run: |
          mkdir -p reports
          bash scripts/test-rails.sh 2>&1 | tee reports/rails-tests.log
      - name: Archive Rails source
        if: always()
        run: python3 scripts/archive-source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rails-source-${{ github.sha }}
          path: artifacts/rails-source.tar.gz
          if-no-files-found: error
      - uses: actions/cache@v4
        with:
          path: .toolchain
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/toolchain.env', 'scripts/install-toolchain.sh') }}
      - name: Install pinned Roundhouse and Spinel
        run: bash scripts/install-toolchain.sh 2>&1 | tee reports/toolchain.log
      - name: Strict transpile and native build
        run: bash scripts/build.sh
      - name: HTTP and restart persistence
        run: bash scripts/smoke-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ github.sha }}
          path: reports/
      - uses: actions/upload-artifact@v4
        with:
          name: native-runtime-${{ github.sha }}
          path: artifacts/blog-linux-x86_64.tar.gz
      - name: Archive emitted source
        run: tar -czf artifacts/spinel-source.tar.gz --exclude=build -C out/spinel .
      - uses: actions/upload-artifact@v4
        with:
          name: spinel-source-${{ github.sha }}
          path: artifacts/spinel-source.tar.gz
  runtime-without-ruby:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 10
    steps:
      - name: Install runtime and verification tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl python3 sqlite3 libsqlite3-0 libjemalloc2
          if command -v ruby || command -v spinel; then exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-runtime-${{ github.sha }}
          path: artifacts/
      - name: Run packaged binary without Ruby or Spinel
        run: bash scripts/smoke-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-diagnostics-${{ github.sha }}
          path: reports/
