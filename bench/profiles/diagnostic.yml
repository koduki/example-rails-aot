{
  "schema_version": 1,
  "description": "Diagnostic profile for JRuby compile.mode ON/OFF and YJIT runtime analysis; not for production performance ranking",
  "targets": [
    "rails-cruby-off",
    "rails-cruby-yjit",
    "emit-cruby-off",
    "emit-cruby-yjit",
    "rails-jruby-off",
    "rails-jruby",
    "emit-jruby-off",
    "emit-jruby"
  ],
  "endpoints": ["/articles"],
  "cpu_count": 1,
  "memory_mb": 3072,
  "threads": 3,
  "spinel_workers": 1,
  "repetitions": 1,
  "seed": 20260924,
  "warmup_min_seconds": 15,
  "warmup_max_seconds": 60,
  "window_seconds": 5,
  "stable_windows": 3,
  "max_cv": 0.1,
  "max_drift": 0.1,
  "measurement_seconds": 15,
  "connections": 4,
  "request_timeout": 5,
  "ready_timeout": 180,
  "total_timeout": 1800,
  "driver": "k6",
  "offered_rps": 50,
  "diagnostics": true,
  "allow_unstable": true
}
