{
  "schema_version": 1,
  "description": "Stepped low-load diagnostic profile to isolate failure envelopes for emit-jruby-off and spinel (Issues #54, #55)",
  "targets": [
    "rails-jruby-off",
    "emit-jruby-off",
    "emit-jruby",
    "spinel"
  ],
  "endpoints": ["/articles?page=1"],
  "fixture_articles": 1000,
  "workload_name": "app-sliced-page20-1000",
  "cpu_count": 4,
  "memory_mb": 14336,
  "threads": 4,
  "spinel_workers": 4,
  "repetitions": 1,
  "seed": 20260929,
  "warmup_min_seconds": 30,
  "warmup_max_seconds": 120,
  "window_seconds": 10,
  "stable_windows": 3,
  "max_cv": 0.1,
  "max_drift": 0.1,
  "measurement_seconds": 30,
  "connections": 4,
  "request_timeout": 5,
  "ready_timeout": 180,
  "total_timeout": 7200,
  "driver": "k6",
  "offered_rps": 10,
  "diagnostics": true,
  "allow_unstable": true,
  "concurrency_sweep_vus": [1, 2, 4, 8, 16, 32],
  "arrival_sweep_rps": [1, 5, 10, 25, 50, 100]
}
